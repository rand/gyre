[project]
name = "gyre"
version = "0.2.0"
description = "Gyre — Proactive Agentic Memory Supervisor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "networkx>=3.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "faiss-cpu; platform_system != 'Windows'",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "dspy-ai>=2.4.0",
  "pytest>=7.4",
  "typer>=0.9",
  "prometheus-client>=0.20"
]

[tool.setuptools]
packages = ["gyre"]

[tool.pytest.ini_options]
addopts = "-q"
