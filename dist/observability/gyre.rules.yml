groups:
  - name: gyre-metrics
    rules:
      - alert: GyreTransportHighLatency
        expr: |
          avg_over_time(gyre_transport_latency_ms_sum[5m]) / avg_over_time(gyre_transport_latency_ms_count[5m]) > 0.4
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Gyre transport latency high ({{ $labels.transport }})"
          description: "Average transport latency >400ms over 10m for {{ $labels.transport }} (tenant={{ $labels.tenant }})."

      - alert: GyreTransportErrorBudget
        expr: |
          rate(gyre_transport_failure_total[5m]) / clamp_min(rate(gyre_transport_success_total[5m]), 1e-6) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Gyre transport error budget exceeded ({{ $labels.transport }})"
          description: "Failure rate exceeded 5% for {{ $labels.transport }} (tenant={{ $labels.tenant }}). Investigate pilot health."
