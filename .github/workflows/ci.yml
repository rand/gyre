name: CI

on:
  push:
    branches: ["main"]
  pull_request: ~

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v1
      - run: uv python install 3.11
      - run: uv pip install -e .
      - run: uv run python -m pytest -q
      - run: DSPY_MOCK=1 uv run python scripts/compile_dspy.py --data-dir data/train
      - run: uv run python scripts/evaluate_dspy.py --log data/logs/propose.jsonl
